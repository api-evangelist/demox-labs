apis:
- name: Aleo RPC API
  description: >-
    Free public JSON-RPC 2.0 API for reading the Aleo zero-knowledge blockchain —
    latest blocks and heights, transactions and transitions, records, deployed
    programs, mapping values, public NFTs and token programs, staking balances,
    and chain status. Also supports generating unsigned transactions and program
    deployments. No authentication; rate limiting may be applied to prevent abuse.
