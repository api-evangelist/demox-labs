aid: demox-labs
name: Demox Labs
description: >-
  Demox Labs is a San Francisco company building privacy infrastructure for
  zero-knowledge (ZK) blockchains, starting with the Aleo network. It is the
  maker of Leo Wallet, a privacy-focused, zero-knowledge cryptocurrency wallet
  that constructs transactions locally on the user's device and lets holders
  conceal or disclose any component of a transaction before it is verified on
  chain. Demox ships developer tooling for the Aleo and Polygon Miden ecosystems:
  the Aleo SDK and Miden SDK (WebAssembly builds), the Aleo and Miden wallet
  adapters (modular TypeScript adapters and React components for connecting
  dApps to compatible wallets), and the public Aleo RPC API, a free JSON-RPC 2.0
  endpoint for reading blocks, transactions, transitions, records, programs,
  mappings, NFTs, and staking data from the Aleo network. Leo Wallet is
  transitioning to Shield, a next-generation Aleo privacy wallet built by
  Provable.
